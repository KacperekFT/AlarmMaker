<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlarmMaker — projektowanie systemów alarmowych</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ebee; --panel:#f5f7f8; --panel2:#e8edf0; --panel3:#dde4e8; --line:#c9d2d8;
  --text:#1a2730; --muted:#586a76; --accent:#0b7285; --accent-ink:#ffffff; --accent-soft:#d3edf1;
  --ws:#c3ccd2; --paper:#f6f8f9; --danger:#c92a2a; --warn:#a85a05; --ok:#2b8a3e;
  --shadow:0 1px 2px rgba(15,30,40,.14),0 8px 24px rgba(15,30,40,.16);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#222a30; --panel:#2a343b; --panel2:#323e46; --panel3:#3c4a54; --line:#47565f;
    --text:#e5ecef; --muted:#9bacb7; --accent:#3cc6d8; --accent-ink:#0b2a30; --accent-soft:#1f4a52;
    --ws:#3b464e; --paper:#f6f8f9; --danger:#ff7b7b; --warn:#f0a050; --ok:#6fcf8a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#222a30; --panel:#2a343b; --panel2:#323e46; --panel3:#3c4a54; --line:#47565f;
  --text:#e5ecef; --muted:#9bacb7; --accent:#3cc6d8; --accent-ink:#0b2a30; --accent-soft:#1f4a52;
  --ws:#3b464e; --paper:#f6f8f9; --danger:#ff7b7b; --warn:#f0a050; --ok:#6fcf8a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.35 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}

#app{height:100%;display:grid;grid-template-rows:44px minmax(0,1fr) 26px}
/* ---------- pasek górny ---------- */
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-weight:700;font-size:18px;letter-spacing:.2px;padding-right:6px}
.brand svg{width:26px;height:26px}
.name-input{height:28px;width:clamp(120px,18vw,240px);border:1px solid transparent;background:transparent;border-radius:5px;padding:0 8px;font-weight:600;font-size:14px}
.name-input:hover{border-color:var(--line)} .name-input:focus{border-color:var(--accent);background:var(--panel2);outline:none}
.menus{display:flex;gap:2px}
.menu{position:relative}
.mbtn,.ibtn,.chip,.btn{border:1px solid transparent;background:transparent;border-radius:6px;height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mbtn:hover,.ibtn:hover,.btn:hover{background:var(--panel3)}
.mbtn[aria-expanded="true"]{background:var(--panel3)}
.ibtn{width:30px;padding:0;justify-content:center}
.ibtn svg{width:18px;height:18px}
.ibtn:disabled{opacity:.35;cursor:default}.ibtn:disabled:hover{background:transparent}
.spacer{flex:1}
.chip{border-color:var(--line);background:var(--panel2);font-size:12px}
.chip.warn{border-color:var(--warn);color:var(--warn);font-weight:600}
.mpop{position:absolute;top:32px;left:0;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:50}
.mpop button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:20px;text-align:left;height:30px;border:0;background:transparent;border-radius:5px;padding:0 10px}
.mpop button:hover{background:var(--accent-soft)}
.mpop kbd,.kbd{font:inherit;font-size:11px;color:var(--muted)}
.mpop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.only-narrow{display:none}

/* ---------- główny układ ---------- */
#main{display:grid;grid-template-columns:62px 252px minmax(0,1fr) 316px;min-height:0;position:relative}
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto}
.tool{width:54px;border:1px solid transparent;border-radius:7px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;color:var(--muted);font-size:10.5px;font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-weight:500}
.tool svg{width:22px;height:22px;color:var(--text)}
.tool:hover{background:var(--panel3)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] svg{color:var(--accent-ink)}
.rail-sep{width:36px;border-top:1px solid var(--line);margin:4px 0}

#palette{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pal-head{padding:8px;border-bottom:1px solid var(--line)}
.pal-head input{width:100%;height:30px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 10px}
#palList{overflow-y:auto;flex:1;padding-bottom:12px}
#palList details{border-bottom:1px solid var(--line)}
#palList summary{list-style:none;cursor:pointer;padding:8px 10px;font-weight:600;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel);z-index:1}
#palList summary::-webkit-details-marker{display:none}
#palList summary::before{content:'';width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
#palList details[open] summary::before{transform:rotate(45deg)}
.cdot{width:10px;height:10px;border-radius:50%}
.pitem{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:4px 10px 4px 14px;min-height:38px;border-left:3px solid transparent}
.pitem:hover{background:var(--panel2)}
.pitem[aria-pressed="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.pitem img{width:28px;height:28px;flex:none}
.pitem .pn{flex:1;line-height:1.2}
.pitem .pr{font-size:11px;color:var(--muted)}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ws)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#optbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:5}
.optgroup{pointer-events:auto;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:var(--shadow)}
.opt{height:26px;border:0;background:transparent;border-radius:6px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.opt:hover{background:var(--panel3)}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.optgroup select{height:26px;border:0;background:transparent;font-size:12px;padding:0 4px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:50px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;box-shadow:var(--shadow);font-size:12px;pointer-events:none;z-index:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{position:absolute;pointer-events:none;z-index:6;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:5px;padding:3px 8px;font-size:12.5px;transform:translate(14px,-30px)}
#zoomctl{position:absolute;right:10px;bottom:44px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
#zoomctl button{width:34px;height:32px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
#zoomctl button:hover{background:var(--panel3)}
#zoomctl svg{width:18px;height:18px}
#tabsbar{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:2px;padding:0 8px;overflow-x:auto;z-index:5}
.ptab{height:28px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:var(--panel2);padding:0 12px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}
.ptab[aria-selected="true"]{background:var(--ws);color:var(--text);font-weight:600;position:relative;top:1px;height:30px}
.ptab .x{opacity:.55;border:0;background:transparent;padding:0 2px;font-size:15px;line-height:1}
.ptab .x:hover{opacity:1;color:var(--danger)}
.ptab.add{background:transparent;border-style:dashed;color:var(--accent);font-weight:600}
#empty{position:absolute;inset:0 0 34px 0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
#empty .card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 28px;max-width:440px;margin:12px}
#empty h2{margin:0 0 6px;font-size:21px;font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-weight:700}
#empty p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5}
#empty .acts{display:flex;flex-wrap:wrap;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.line{border-color:var(--line);background:var(--panel2)}
.btn.line:hover{background:var(--panel3)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.lg{height:36px;padding:0 16px;font-size:14px}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
#drop{position:absolute;inset:6px;border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);z-index:20;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;pointer-events:none}

/* ---------- panel boczny ---------- */
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:36px;border:0;background:transparent;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;padding:0 1px;font-size:12px}
.tabs button:hover{background:var(--panel2)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabpane{flex:1;overflow-y:auto;padding:10px 12px 18px}
.sec{margin:0 0 14px}
.sec>h3{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between}
.row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;min-height:28px;margin:2px 0}
.row .lbl{color:var(--muted);font-size:12px}
.ctl{display:flex;align-items:center;gap:6px;min-width:0}
.ctl input[type=text],.ctl input[type=number],.ctl input[type=date],.ctl select,.ctl textarea,.sec input.full,.sec select.full{width:100%;min-width:0;height:28px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:0 8px}
.ctl textarea{height:56px;padding:5px 8px;resize:vertical}
.ctl input.num{width:68px;flex:none;text-align:right}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctl .unit{color:var(--muted);font-size:12px;width:20px;flex:none}
.ctl input:focus,.ctl select:focus,.ctl textarea:focus{outline:none;border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;min-height:26px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.title img{width:34px;height:34px}
.title b{font-size:15px;line-height:1.2}
.title small{display:block;color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:600}
.note{color:var(--muted);font-size:12px;line-height:1.45}
.note.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:7px;padding:7px 9px;background:color-mix(in srgb,var(--warn) 9%,transparent)}
.zone{display:flex;align-items:center;gap:7px;margin:3px 0}
.zone input[type=color]{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;padding:1px;background:var(--panel2);flex:none}
.zone input[type=text]{flex:1;min-width:0;height:26px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:0 7px}
.zone .cnt{font-size:11px;color:var(--muted);width:30px;text-align:right}
.zone .x{border:0;background:transparent;color:var(--muted);font-size:16px;width:22px}
.zone .x:hover{color:var(--danger)}
.bar{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:4px}
.rrow{border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin:0 0 7px;background:var(--panel2)}
.rrow .rh{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:5px}
.rrow .rh span:last-child{color:var(--muted);font-weight:500}
.cr{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin:2px 0}
.cr b{color:var(--text);text-align:right;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;padding:3px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right}
table.t img{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;height:26px;border:0;background:var(--panel2);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- status ---------- */
#status{display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
#status .grow{flex:1;overflow:hidden;text-overflow:ellipsis}

/* ---------- modale i toasty ---------- */
.mback{position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal header{padding:14px 18px 6px;font-size:16px;font-weight:700;font-family:'Barlow Semi Condensed','Barlow',sans-serif}
.modal .mb{padding:6px 18px 12px;overflow:auto;line-height:1.5}
.modal footer{padding:10px 18px 14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal input.full{width:100%;height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 10px;margin-top:4px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .opt-card{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--panel2)}
.modal .opt-card h4{margin:0 0 4px;font-size:13.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:2px}
.thumb{border:2px solid var(--line);border-radius:8px;background:var(--panel2);padding:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted)}
.thumb canvas{width:100%;height:auto;background:#fff;display:block;margin-bottom:4px;border-radius:3px}
.thumb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
.keys b{font-weight:600;white-space:nowrap}
.keys b i{font-style:normal;display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--panel2);font-size:12px;min-width:22px;text-align:center}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;max-width:90vw}
.busy{position:fixed;inset:0;z-index:150;background:rgba(10,20,26,.35);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--panel);padding:14px 22px;border-radius:10px;box-shadow:var(--shadow);font-weight:600}

/* ---------- widok wąski ---------- */
@media (max-width:1100px){
  #main{grid-template-columns:58px minmax(0,1fr)}
  #palette,#side{position:absolute;top:0;bottom:0;z-index:40;width:min(320px,86vw);box-shadow:var(--shadow);display:none}
  #palette{left:58px}
  #side{right:0;border-left:1px solid var(--line)}
  #main.showL #palette{display:flex}
  #main.showR #side{display:flex}
  .only-narrow{display:inline-flex}
  #stage{grid-column:2}
  .name-input{width:110px}
  #optbar{right:8px}
}
@media (max-width:640px){
  .brand span{display:none}
  .menus .mbtn{padding:0 7px}
  #status .hide-s{display:none}
  .tool{width:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" aria-label="AlarmMaker">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><path d="M16 16 L28 10.5 A13.2 13.2 0 0 1 28 21.5 Z" fill="var(--accent)" opacity=".9"/><circle cx="16" cy="16" r="3.4" fill="currentColor"/></svg>
      <span>AlarmMaker</span>
    </div>
    <input id="projName" class="name-input" aria-label="Nazwa projektu" spellcheck="false">
    <nav class="menus" id="menus"></nav>
    <div class="spacer"></div>
    <button class="ibtn" id="btnUndo" title="Cofnij (Ctrl+Z)" aria-label="Cofnij"></button>
    <button class="ibtn" id="btnRedo" title="Ponów (Ctrl+Y)" aria-label="Ponów"></button>
    <button class="chip" id="scaleChip" title="Ustaw skalę rysunku"></button>
    <button class="ibtn" id="btnHelp" title="Skróty klawiszowe i pomoc (?)" aria-label="Pomoc"></button>
    <button class="ibtn only-narrow" id="btnPanelL" title="Katalog urządzeń" aria-label="Katalog urządzeń"></button>
    <button class="ibtn only-narrow" id="btnPanelR" title="Panel właściwości" aria-label="Panel właściwości"></button>
  </header>
  <div id="main">
    <aside id="rail" aria-label="Narzędzia"></aside>
    <aside id="palette" aria-label="Katalog urządzeń">
      <div class="pal-head"><input id="palSearch" type="search" placeholder="Szukaj w katalogu…" aria-label="Szukaj urządzenia"></div>
      <div id="palList"></div>
    </aside>
    <section id="stage">
      <canvas id="cv" tabindex="0" aria-label="Obszar rysunku"></canvas>
      <div id="optbar"></div>
      <div id="empty" hidden></div>
      <div id="hud" hidden></div>
      <div id="hint"></div>
      <div id="zoomctl"></div>
      <div id="tabsbar" role="tablist" aria-label="Kondygnacje"></div>
      <div id="drop" hidden>Upuść plik PDF, obraz lub projekt (.json)</div>
    </section>
    <aside id="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="props" aria-selected="true">Właściwości</button>
        <button role="tab" data-tab="layers" aria-selected="false">Widok</button>

function distSeg(px, py, ax, ay, bx, by) {

}

function occl(pl) {

    const n = r.pts.length;

  dim: 'Wymiar: kliknij dwa punkty.',
  scale: 'Skala: kliknij dwa punkty odcinka o znanej długości (np. wymiar z rysunku), potem wpisz jego długość.',
  line: 'Kliknij kolejne punkty trasy. Dwuklik / Enter / prawy przycisk — koniec. Przyciąga do urządzeń.',

function setTool(t, arg) {

  S.tool = t; S.placing = null;

  if (t === 'line') S.lineKind = arg || S.lineKind || 'cab_bus';
  if (t === 'line' && arg == null && !S.lineKind) S.lineKind = 'cab_bus';
  refreshTools(); requestDraw();
}
function hintText() {
  if (S.tool === 'place' && S.placing) return 'Wstawianie: ' + DEV[S.placing].name + '. Kliknij, aby umieścić; przeciągnij, aby ustawić kierunek. Q / E — obrót. Esc — koniec.';

  return TOOL_HINT[S.tool] || '';
}
function defaultZoneAt(pl, x, y) {

  return null;
}
function createRoom(pts) {
  const pl = plan();

}
function finishRect(p) {

  if (Math.abs(p.x - a.x) < 0.2 * pl.ppm || Math.abs(p.y - a.y) < 0.2 * pl.ppm) { toast('Prostokąt jest zbyt mały (min. 0,2 m)'); requestDraw(); return; }
  createRoom([{ x: a.x, y: a.y }, { x: p.x, y: a.y }, { x: p.x, y: p.y }, { x: a.x, y: p.y }]);
}
function finishDraw(cancel) {
  const dr = S.draw; if (!dr) return;
  const pl = plan(); S.draw = null; S.typed = ''; hideHud(); requestDraw();
  if (cancel) { if (dr.kind === 'wall' && dr.created) commit(); return; }
  if (dr.kind === 'wall') { if (dr.created) commit(); }

  else if (dr.kind === 'line') {
    if (dr.pts.length >= 2) { const l = { id: uid(), kind: dr.lineKind, pts: dr.pts.map(p => ({ x: p.x, y: p.y })), label: '' }; pl.lines.push(l); S.sel = [{ k: 'l', id: l.id }]; commit(); refreshSelection(); }
  } else if (dr.kind === 'dim') {
    if (dr.pts.length >= 2) { const l = { id: uid(), kind: 'dim', pts: dr.pts.map(p => ({ x: p.x, y: p.y })), label: '' }; pl.lines.push(l); commit(); }
  } else if (dr.kind === 'scale') {
    const a = dr.pts[0], b = dr.pts[1], d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < 1) return;

        for (const dev of pl.devices) dev._vis = null;

}
function drawClick(p) {
  const pl = plan(), t = S.tool, z = V().z;
  let dr = S.draw;

  S.typed = ''; hideHud();
  if (t === 'wall') {
    if (!dr) { S.draw = { kind: 'wall', pts: [p], created: 0 }; return; }
    const last = dr.pts[dr.pts.length - 1];
    if (near(p, last)) { finishDraw(); return; }
    addWall(pl, last, p); dr.created++; dr.pts.push(p); touch();
    if (dr.pts.length > 2 && near(p, dr.pts[0])) finishDraw();
  } else if (t === 'room') {
    if (!dr) { S.draw = { kind: 'room', pts: [p] }; return; }
    const last = dr.pts[dr.pts.length - 1], fs = w2s(V(), dr.pts[0]);
    if (dr.pts.length >= 3 && (Math.hypot(S.mx - fs.x, S.my - fs.y) < 12 || near(p, dr.pts[0]))) { finishDraw(); return; }
    if (near(p, last)) { if (dr.pts.length >= 3) finishDraw(); return; }
    dr.pts.push(p);

    if (!dr) { S.draw = { kind: 'line', lineKind: S.lineKind, pts: [p] }; return; }
    const last = dr.pts[dr.pts.length - 1];
    if (near(p, last)) { finishDraw(); return; }
    dr.pts.push(p);
    if (LINE[dr.lineKind].beam && dr.pts.length === 2) finishDraw();
  } else if (t === 'dim' || t === 'scale') {
    if (!dr) { S.draw = { kind: t, pts: [p] }; return; }

function undoLastPoint() {
  const dr = S.draw; if (!dr) return;
  if (dr.kind === 'wall') {
    if (dr.pts.length > 1) { const pl = plan(); pl.walls.pop(); dr.created = Math.max(0, dr.created - 1); dr.pts.pop(); touch(); } else S.draw = null;
  } else if (dr.pts) { dr.pts.pop(); if (!dr.pts.length) S.draw = null; } else S.draw = null;
  requestDraw();
}

/* wpisywanie długości z klawiatury */
function typedKey(e) {
  const dr = S.draw; if (!dr) return false;
  if (/^[0-9.,]$/.test(e.key)) { S.typed += e.key === ',' ? '.' : e.key; showHud(); return true; }
  if (dr.kind === 'rect' && /^[xX;*]$/.test(e.key)) { S.typed += 'x'; showHud(); return true; }
  if (e.key === 'Backspace' && S.typed) { S.typed = S.typed.slice(0, -1); showHud(); return true; }
  if (e.key === 'Enter' && S.typed) { applyTyped(); return true; }

}
function applyTyped() {
  const pl = plan(), dr = S.draw, sn = S.snap || { x: S.wx, y: S.wy };
  if (!dr) return;
  if (dr.kind === 'rect') {
    const m = S.typed.split('x').map(parseFloat), w = m[0], hh = isNaN(m[1]) ? m[0] : m[1];
    if (!(w > 0 && hh > 0)) { toast('Podaj wymiary w metrach, np. 4x3'); return; }
    const sx = sn.x >= dr.a.x ? 1 : -1, sy = sn.y >= dr.a.y ? 1 : -1;
    finishRect({ x: dr.a.x + sx * w * pl.ppm, y: dr.a.y + sy * hh * pl.ppm }); return;
  }
  const last = dr.pts[dr.pts.length - 1], len = parseFloat(S.typed);
  if (!(len > 0)) { S.typed = ''; hideHud(); return; }
  let dx = sn.x - last.x, dy = sn.y - last.y; const dl = Math.hypot(dx, dy);
  if (dl < 1e-6) { dx = 1; dy = 0; } else { dx /= dl; dy /= dl; }
  drawClick({ x: last.x + dx * len * pl.ppm, y: last.y + dy * len * pl.ppm });
}

/* ---------- uchwyty ---------- */
function coincident(pl, pt, eps) {

  for (const w of pl.walls) { if (close(w.a)) out.push({ pt: w.a, ref: 'w:' + w.id + ':a' }); if (close(w.b)) out.push({ pt: w.b, ref: 'w:' + w.id + ':b' }); }
  for (const r of pl.rooms) r.pts.forEach((q, i) => { if (close(q)) out.push({ pt: q, ref: 'r:' + r.id + ':' + i }); });
  return out;
}
function startHandle(hd, sx, sy) {

}

  if (d.k === 'd') {
    const dx = wp.x - e.x, dy = wp.y - e.y, ang = Math.atan2(dy, dx) * R2D;

}
function applyMove(d, wp) {

  let dx = wp.x - d.start.x, dy = wp.y - d.start.y;

/* ---------- zoom i widok ---------- */
function zoomAt(sx, sy, f) {
  const v = V(), nz = clamp(v.z * f, 0.02, 60), k = nz / v.z;
  v.x = sx - (sx - v.x) * k; v.y = sy - (sy - v.y) * k; v.z = nz; v.fit = false; requestDraw();

/* ---------- zdarzenia wskaźnika ---------- */
function posOf(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function onDown(e) {

    return;
  }

  const v = V(), wp = s2w(v, p.x, p.y), pl = plan();

    const hit = hitTest(pl, p.x, p.y);

      if (e.shiftKey) { if (isSel(hit.k, hit.id)) S.sel = S.sel.filter(s => !(s.k === hit.k && s.id === hit.id)); else S.sel = [...S.sel, hit]; }

function onMove(e) {
  const p = posOf(e);

async function saveFile(name, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data }); toast('Zapisano: ' + name); } catch (e) { if (!e || e.code !== 'declined') toast('Nie udało się zapisać pliku (' + ((e && e.code) || 'błąd') + ')'); }
    return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]), a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Pobieranie: ' + name);
  } catch (e) { toast('Zapis plików nie jest tu dostępny'); }
}
function saveProjectFile() { const o = projectObject(true); saveFile(fileBase() + '.zasieg.json', JSON.stringify(o)); }
function bgFromUrl(id, url, w, hh) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); BG.set(id, { canvas: c, w: w || img.width, h: hh || img.height, url, saved: true }); res(true); };
    img.onerror = () => res(false); img.src = url;
  });
}
async function loadProject(obj, lookup) {
  const np = mkProject(); np.name = obj.name || 'Projekt'; np.client = obj.client || ''; np.author = obj.author || ''; np.date = obj.date || np.date;
  if (obj.zones && obj.zones.length) np.zones = obj.zones; np.counters = obj.counters || {}; np.cableGroups = obj.cableGroups || []; np.plans = [];
  const o = obj.opts || {}; Object.assign(O, o); O.L = Object.assign({}, DEFAULT_L, o.L || {});
  for (const pc of (obj.plans || [])) {
    const pl = Object.assign(mkPlan(pc.name), { id: pc.id || uid(), ppm: pc.ppm || 50, calibrated: !!pc.calibrated, bgKind: pc.bgKind || null, rooms: pc.rooms || [], walls: pc.walls || [], doors: pc.doors || [], devices: pc.devices || [], lines: pc.lines || [], texts: pc.texts || [] });
    if (pc.view) pl.view = Object.assign({}, pc.view, { fit: !!pc.view.fit });
    np.plans.push(pl);
    const url = pc.bg || (lookup ? lookup(pl.id) : null);
    if (url) { const ok = await bgFromUrl(pl.id, url, pc.bgW, pc.bgH); if (!ok) pl.bgKind = null; }
  }
  if (!np.plans.length) np.plans = [mkPlan('Parter')];
  P = np; ai = 0; S.sel = []; S.draw = null; emptyDismissed = np.plans.some(p => BG.has(p.id) || p.rooms.length || p.devices.length);
  histReset(); for (const p of P.plans) if (p.view.fit || BG.has(p.id)) { }
  fitView(plan(), true); refreshUI(true); requestDraw();
}
async function openProjectFile(file) {
  try { const obj = JSON.parse(await file.text()); if (obj.app !== 'zasieg') throw new Error('To nie jest plik projektu Zasięg'); await loadProject(obj); saveLocal(); toast('Otwarto projekt: ' + P.name); }
  catch (e) { toast('Nie udało się otworzyć projektu: ' + e.message); }
}
async function newProjectAction() {
  const has = P.plans.some(p => p.rooms.length || p.devices.length || BG.has(p.id));
  if (has && !(await confirmBox('Nowy projekt', 'Bieżący projekt zostanie zamknięty. Zapisz go wcześniej, jeśli chcesz go zachować.', 'Utwórz nowy'))) return;
  BG.clear(); P = mkProject(); ai = 0; S.sel = []; S.draw = null; emptyDismissed = false; histReset(); fitView(plan(), true); refreshUI(true); scheduleSave();
}

/* ---------- eksport ---------- */
async function exportPng() {
  const stop = busy('Przygotowanie arkusza…'); await new Promise(r => setTimeout(r, 30));
  try { const c = sheetCanvas(plan(), 4200, 2970); const blob = await new Promise(r => c.toBlob(r, 'image/png')); stop(); await saveFile(fileBase() + '-' + plan().name.replace(/[^\p{L}\p{N}_-]+/gu, '_') + '.png', blob); }
  catch (e) { stop(); toast('Błąd eksportu: ' + e.message); }
}
async function exportPdf() {
  const stop = busy('Generowanie PDF…');
  try {
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await new Promise(r => setTimeout(r, 30));
    const { jsPDF } = window.jspdf, doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    P.plans.forEach((pl, i) => { if (i) doc.addPage('a3', 'landscape'); const c = sheetCanvas(pl, 3508, 2480); doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 420, 297); });
    const blob = doc.output('blob'); stop(); await saveFile(fileBase() + '.pdf', blob);
  } catch (e) { stop(); console.error(e); toast('Nie udało się wygenerować PDF: ' + e.message); }
}
async function makeReport() {
  const stop = busy('Budowanie raportu…'); await new Promise(r => setTimeout(r, 30));
  try {
    const b = bomData('all'), css = 'body{font:14px/1.5 system-ui,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#1a2730}h1{margin:0 0 4px}h2{margin:28px 0 8px;border-bottom:2px solid #1a2730;padding-bottom:4px}table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border:1px solid #c9d2d8;padding:5px 8px;text-align:left}th{background:#eef2f4}td.n{text-align:right}img{max-width:100%;border:1px solid #c9d2d8}.m{color:#586a76}';
    let html = '<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><title>' + esc(P.name) + ' — raport</title><style>' + css + '</style></head><body>';
    html += '<h1>' + esc(P.name) + '</h1><div class="m">Inwestor: ' + esc(P.client || '—') + ' · Projektant: ' + esc(P.author || '—') + ' · Data: ' + esc(P.date || '') + '</div>';
    html += '<h2>Zestawienie urządzeń</h2><table><tr><th>Skrót</th><th>Nazwa</th><th class="n">Ilość</th></tr>' + b.devs.map(x => '<tr><td>' + esc(x.def.abbr) + '</td><td>' + esc(x.def.name) + '</td><td class="n">' + x.n + '</td></tr>').join('') + '</table>';
    if (b.lines.length) html += '<h2>Okablowanie i bariery</h2><table><tr><th>Rodzaj</th><th class="n">Długość [m]</th><th class="n">Z zapasem ' + O.reserve + '% [m]</th></tr>' + b.lines.map(x => '<tr><td>' + esc(x.def.name) + '</td><td class="n">' + fnum(x.len, 1) + '</td><td class="n">' + fnum(x.len * (1 + O.reserve / 100), 1) + '</td></tr>').join('') + '</table>';
    if (b.rooms.length) html += '<h2>Pokrycie pomieszczeń</h2><table><tr><th>Kondygnacja</th><th>Pomieszczenie</th><th class="n">m²</th><th class="n">Włamanie</th><th class="n">Pożar</th><th class="n">Wideo</th></tr>' + b.rooms.map(x => '<tr><td>' + esc(x.plan) + '</td><td>' + esc(x.name) + '</td><td class="n">' + fnum(x.area, 1) + '</td>' + ['intr', 'fire', 'video'].map(c => '<td class="n">' + (x.pct[c] == null ? '—' : fnum(x.pct[c], 0) + '%') + '</td>').join('') + '</tr>').join('') + '</table>';
    for (const pl of P.plans) { const c = sheetCanvas(pl, 2600, 1840); html += '<h2>Rzut: ' + esc(pl.name) + '</h2><img alt="Rzut ' + esc(pl.name) + '" src="' + c.toDataURL('image/jpeg', 0.88) + '">'; }
    html += '<p class="m">Wartości zasięgów w katalogu są orientacyjne. Przed realizacją zweryfikuj je z danymi producenta i obowiązującymi normami.</p></body></html>';
    stop(); await saveFile(fileBase() + '-raport.html', html);
  } catch (e) { stop(); toast('Błąd raportu: ' + e.message); }
}

/* ---------- menu górne ---------- */
function buildMenus() {
  const defs = [
    { id: 'file', label: 'Plik', items: [['Nowy projekt', '', newProjectAction], ['Otwórz projekt…', '', () => { $('#fileIn').click(); }], ['Zapisz projekt', 'Ctrl+S', saveProjectFile], '-', ['Wgraj PDF lub obraz podkładu…', '', () => $('#fileIn').click()], ['Dodaj pustą kondygnację', '', () => addPlan()], '-', ['Wczytaj przykład', '', loadDemo]] },
    { id: 'exp', label: 'Eksport', items: [['Arkusz bieżącej kondygnacji (PNG)', '', exportPng], ['Wszystkie kondygnacje (PDF A3)', '', exportPdf], ['Zestawienie (CSV)', '', () => saveFile(fileBase() + '-zestawienie.csv', '\uFEFF' + bomCsv(bomData('all')))], ['Raport z rzutami (HTML)', '', makeReport]] },
    { id: 'view', label: 'Widok', items: [['Dopasuj do okna', 'F', () => fitView(plan())], ['Powiększ', '', () => zoomAt(cssW / 2, cssH / 2, 1.3)], ['Pomniejsz', '', () => zoomAt(cssW / 2, cssH / 2, 1 / 1.3)], '-', ['Skróty klawiszowe', '?', showHelp]] }
  ];
  const nav = $('#menus'); nav.replaceChildren();
  for (const m of defs) {
    const pop = h('div', { class: 'mpop', hidden: true }, m.items.map(it => it === '-' ? h('hr') : h('button', { onclick: () => { closeMenus(); it[2](); } }, h('span', { text: it[0] }), h('kbd', { text: it[1] }))));
    const btn = h('button', { class: 'mbtn', 'aria-expanded': 'false', 'aria-haspopup': 'true', text: m.label, onclick: e => { e.stopPropagation(); const open = pop.hidden; closeMenus(); if (open) { pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); } } });
    nav.append(h('div', { class: 'menu' }, btn, pop));
  }
}
function closeMenus() { $$('.mpop').forEach(p => p.hidden = true); $$('.mbtn').forEach(b => b.setAttribute('aria-expanded', 'false')); }

/* ---------- przykład ---------- */
function loadDemo() {
  let pl = plan();
  if (BG.has(pl.id) || pl.rooms.length || pl.devices.length || pl.walls.length) { pl = mkPlan('Przykład — biuro'); P.plans.push(pl); ai = P.plans.length - 1; } else pl.name = 'Przykład — biuro';
  pl.ppm = 50; pl.calibrated = true; const m = 50;
  const rooms = [['Open space', 0, 0, 7, 5, 'z1'], ['Serwerownia', 7, 0, 10, 3, 'z2'], ['Gabinet', 7, 3, 10, 5, 'z1'], ['Korytarz', 0, 5, 10, 7, 'z1'], ['Magazyn', 0, 7, 5, 10, 'z2'], ['Socjalny', 5, 7, 10, 10, 'z3']];
  for (const r of rooms) {
    const pts = [{ x: r[1] * m, y: r[2] * m }, { x: r[3] * m, y: r[2] * m }, { x: r[3] * m, y: r[4] * m }, { x: r[1] * m, y: r[4] * m }];
    pl.rooms.push({ id: uid(), name: r[0], pts, h: 2.8, zone: P.zones.find(z => z.id === r[5]) ? r[5] : null });
    addWallsForPoly(pl, pts);
  }
  for (const d of [[3.5, 5], [7, 1.5], [7, 4], [8.5, 5], [2.5, 7], [7.5, 7]]) punchDoor(pl, { x: d[0] * m, y: d[1] * m }, 0.9);
  const dev = (t, x, y, rot, z) => pl.devices.push(newDevice(t, x * m, y * m, rot, z));
  dev('pir_wide', 0.35, 0.35, 135, 'z1'); dev('pir', 9.65, 0.35, 225, 'z2'); dev('pir', 9.65, 4.65, 315, 'z1'); dev('pir', 0.35, 9.65, 45, 'z2'); dev('pir', 9.65, 9.65, 315, 'z3'); dev('dual', 0.35, 6, 90, 'z1');
  dev('smoke', 3.5, 2.5, 0, 'z1'); dev('smoke', 8.5, 1.5, 0, 'z2'); dev('smoke', 8.5, 4, 0, 'z1'); dev('smoke', 2, 6, 0, 'z1'); dev('smoke', 7, 6, 0, 'z1'); dev('smoke', 2.5, 8.5, 0, 'z2'); dev('smoke', 7.5, 8.5, 0, 'z3');
  dev('cam_bullet', 9.65, 6.35, 270, 'z1'); dev('panel', 0.3, 5.45, 0, 'z1'); dev('keypad', 0.3, 6.55, 0, 'z1');
  pl.lines.push({ id: uid(), kind: 'cab_bus', pts: [{ x: 0.6 * m, y: 5.8 * m }, { x: 9.4 * m, y: 5.8 * m }, { x: 9.4 * m, y: 4.6 * m }], label: 'magistrala A' });
  pl.texts.push({ id: uid(), x: 0.3 * m, y: 7.6 * m - 80, text: 'Wejście główne', size: 0.35 });
  pl.view.fit = true; fitView(pl, true); emptyDismissed = true; S.sel = []; commit(); refreshUI(true); toast('Wczytano przykład. Spróbuj przeciągnąć czujkę albo kliknij „Analiza”.');
}

/* ---------- start ---------- */
function bindUI() {
  $('#btnUndo').innerHTML = icon('undo'); $('#btnRedo').innerHTML = icon('redo'); $('#btnHelp').innerHTML = icon('help'); $('#btnPanelL').innerHTML = icon('catalog'); $('#btnPanelR').innerHTML = icon('panel');
  $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo; $('#btnHelp').onclick = showHelp;
  $('#scaleChip').onclick = () => showScaleDialog(plan());
  $('#btnPanelL').onclick = () => { $('#main').classList.toggle('showL'); $('#main').classList.remove('showR'); };
  $('#btnPanelR').onclick = () => { $('#main').classList.toggle('showR'); $('#main').classList.remove('showL'); };
  $('#projName').addEventListener('input', e => { P.name = e.target.value; document.title = P.name + ' — AlarmMaker'; scheduleSave(); });
  $('#palSearch').addEventListener('input', buildPalette);
  $$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  const zc = $('#zoomctl');
  zc.append(h('button', { title: 'Powiększ', 'aria-label': 'Powiększ', html: icon('plus'), onclick: () => zoomAt(cssW / 2, cssH / 2, 1.3) }), h('button', { title: 'Pomniejsz', 'aria-label': 'Pomniejsz', html: icon('minus'), onclick: () => zoomAt(cssW / 2, cssH / 2, 1 / 1.3) }), h('button', { title: 'Dopasuj do okna (F)', 'aria-label': 'Dopasuj do okna', html: icon('fit'), onclick: () => fitView(plan()) }));
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu')) closeMenus(); });
  $('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); });
  const st = $('#stage'); let dc = 0;
  st.addEventListener('dragenter', e => { e.preventDefault(); dc++; $('#drop').hidden = false; });
  st.addEventListener('dragover', e => e.preventDefault());
  st.addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; $('#drop').hidden = true; } });
  st.addEventListener('drop', e => { e.preventDefault(); dc = 0; $('#drop').hidden = true; importFile(e.dataTransfer.files[0]); });
  if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(st); else window.addEventListener('resize', resizeCanvas);
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
async function init() {
  P = mkProject(); ai = 0;
  cv = $('#cv'); cx = cv.getContext('2d');
  readTheme(); buildRail(); buildMenus(); buildOptbar(); bindUI(); bindCanvas(); buildPalette();
  histReset(); resizeCanvas(); setTab('props'); refreshUI(true);
  requestAnimationFrame(frame);
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      if (obj && obj.app === 'zasieg' && obj.plans && obj.plans.some(p => (p.devices || []).length || (p.rooms || []).length || (p.walls || []).length || p.bgKind)) {
        await loadProject(obj, id => { try { return localStorage.getItem(LS_KEY + '.bg.' + id); } catch (e) { return null; } });
        toast('Przywrócono ostatni projekt');
      }
    }
  } catch (e) { /* brak zapisu */ }
  buildOptbar(); syncOptbar();
}
window.addEventListener('DOMContentLoaded', init);
